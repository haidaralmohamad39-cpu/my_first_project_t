<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taj & Haider ❤️</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at center, #5c0015 0%, #1a0008 45%, #050505 100%);
      color: white;
    }

    /* Floating hearts */
    .floating-heart {
      position: absolute;
      color: #ff1744;
      font-size: 25px;
      animation: float 5s infinite ease-in-out;
      text-shadow: 0 0 15px #ff1744;
    }

    .h1 { left: 10%; top: 20%; animation-delay: 0s; }
    .h2 { left: 85%; top: 25%; animation-delay: 1s; }
    .h3 { left: 15%; top: 75%; animation-delay: 2s; }
    .h4 { left: 80%; top: 75%; animation-delay: 3s; }
    .h5 { left: 50%; top: 10%; animation-delay: 1.5s; }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) scale(1);
      }
      50% {
        transform: translateY(-25px) scale(1.2);
      }
    }

    .card {
      width: min(90%, 650px);
      padding: 45px 25px;
      text-align: center;
      border: 2px solid #d4af37;
      border-radius: 30px;
      background: rgba(10, 0, 5, 0.75);
      box-shadow:
        0 0 25px rgba(255, 0, 60, 0.5),
        0 0 60px rgba(212, 175, 55, 0.25),
        inset 0 0 30px rgba(255, 0, 60, 0.1);
      backdrop-filter: blur(8px);
      z-index: 2;
    }

    .small-heart {
      font-size: 45px;
      animation: beat 1.2s infinite;
      filter: drop-shadow(0 0 12px red);
    }

    @keyframes beat {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.25);
      }
    }

    h1 {
      margin-top: 10px;
      font-size: clamp(45px, 10vw, 80px);
      font-style: italic;
      color: #ffd700;
      text-shadow:
        0 0 8px #ffd700,
        0 0 20px #ff1744;
    }

    .ampersand {
      color: white;
      font-size: 35px;
      margin: 5px;
    }

    .date {
      display: inline-block;
      margin: 25px 0;
      padding: 12px 30px;
      border-radius: 50px;
      border: 2px solid #d4af37;
      color: #ffd700;
      font-size: 25px;
      letter-spacing: 4px;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
    }

    .message {
      font-size: clamp(22px, 5vw, 32px);
      line-height: 1.6;
      font-style: italic;
      color: #fff;
      text-shadow: 0 0 10px rgba(255,255,255,0.5);
    }

    .forever {
      color: #ff5577;
      font-weight: bold;
    }

    .infinity {
      margin-top: 20px;
      font-size: 55px;
      color: #ffd700;
      text-shadow: 0 0 15px #ffd700;
    }

    .sparkle {
      color: #ffd700;
    }

    .footer {
      margin-top: 20px;
      color: #aaa;
      font-size: 14px;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>

  <!-- Floating hearts -->
  <div class="floating-heart h1">♥</div>
  <div class="floating-heart h2">♥</div>
  <div class="floating-heart h3">♥</div>
  <div class="floating-heart h4">♥</div>
  <div class="floating-heart h5">♥</div>

  <div class="card">

    <div class="small-heart">❤️</div>

    <h1>Taj</h1>

    <div class="ampersand">&amp;</div>

    <h1>Haider</h1>

    <div class="date">
      9 / 6 / 2025
    </div>

    <div class="message">
      <span class="forever">Forever and Always</span>
      <br>
      Until the End of Life
    </div>

    <div class="infinity">
      ∞ ❤️ ∞
    </div>

    <div class="footer">
      <span class="sparkle">✦</span>
      Taj & Haider
      <span class="sparkle">✦</span>
    </div>

  </div>

</body>
</html>
